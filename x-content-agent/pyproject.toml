[project]
name = "x-content-agent"
version = "0.1.0"
description = "AI Agent for X (Twitter) content generation, strategy, and analytics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.0",
    "croniter>=2.0.0",
    "numpy>=1.26.4",
]

[tool.ruff]
indent-width = 4
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]
